<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="키즈위키">
  <!-- 파비콘 전용 단순화 마크. brand/kiwi-mark.png 를 축소한 게 아니다 —
       원본의 로우폴리 면과 16개 씨앗 고리는 16px 에서 초록 덩어리로 뭉개진다(브라우저 측정 확인).
       16px 에 남는 정보인 "초록 둥근 다각형 + 밝은 중심" 만 크게 잡았다.
       7각형인 이유: 원본 실루엣에 가깝고, 내접반지름이 R·cos(π/7)≈0.90R 라 씨앗 고리가
       변을 넘지 않는다(정삼각형은 내접이 R/2 라 씨앗이 변 밖으로 삐져나갔다). -->
