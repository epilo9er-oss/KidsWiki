<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="키즈위키 로고">
  <!-- 키즈위키 엠블럼 — 라즈베리→그레이프 그라데이션 둥근 사각 위 흰 펼친 책.
       색은 scripts/themes/kids.mjs 의 wiki-primary(#c2255c) / wiki-accent(#7048c6) 토큰과 맞춘다.
       테마를 바꾸면 이 파일도 함께 바꿔야 한다(SVG 는 CSS 토큰을 읽지 못한다).
       주의: XML 주석에는 연속 하이픈을 쓸 수 없으므로 토큰명을 접두 하이픈 없이 적는다.

       흰 테두리 링이 있는 이유: 이 마크는 두 배경 위에 동시에 놓인다.
        - 헤더  = 같은 두 색의 그라데이션 바 → 링 없으면 타일이 배경에 묻힌다.
        - 사이드바 = 크림/흰 표면 → 그라데이션 타일 자체가 대비를 만든다.
       링을 두면 양쪽 모두에서 실루엣이 분리된다. 반짝임(별)은 헤더 표시 크기(32px)에서
       2px 남짓이라 노이즈가 되어 넣지 않았다. -->
  <defs>
    <linearGradient id="kidsMark" x1="56" y1="56" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2255c"/>
      <stop offset="1" stop-color="#7048c6"/>
    </linearGradient>
  </defs>

  <rect x="44" y="44" width="424" height="424" rx="106"
        fill="url(#kidsMark)" stroke="#ffffff" stroke-width="24"/>

  <!-- 펼친 책 — 두 페이지 + 가운데 접힘. 32px 축소 시에도 남는 굵은 실루엣. -->
  <path d="M256 176c-32-24-73-33-116-28-12 1.5-20 12-20 24v142c0 15 13 26 28 24 35-4.5 69 3 108 24V176z"
        fill="#ffffff"/>
  <path d="M256 176c32-24 73-33 116-28 12 1.5 20 12 20 24v142c0 15-13 26-28 24-35-4.5-69 3-108 24V176z"
        fill="#ffffff" fill-opacity="0.85"/>
</svg>
